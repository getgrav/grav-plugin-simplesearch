name: SimpleSearch
type: plugin
slug: simplesearch
version: 3.0.0-enhanced
description: "Enhanced **SimpleSearch** plugin with intelligent relevance scoring, pagination, highlighting, instant search, autocomplete, dark mode, and modern responsive design. Fast and highly configurable search for your content."
icon: search
author:
  name: Team Grav
  email: devs@getgrav.org
  url: http://getgrav.org
homepage: https://github.com/getgrav/grav-plugin-simplesearch
demo: http://demo.getgrav.org/blog-skeleton
keywords: simplesearch, plugin, search, page, content, find
bugs: https://github.com/getgrav/grav-plugin-simplesearch/issues
license: MIT

dependencies:
    - { name: grav, version: '>=1.7.0' }

form:
  validation: strict
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    search_content:
      type: select
      size: medium
      classes: fancy
      label: PLUGIN_SIMPLESEARCH.SEARCH_CONTENT
      default: rendered
      options:
        rendered: PLUGIN_SIMPLESEARCH.RENDERED_CONTENT
        raw: PLUGIN_SIMPLESEARCH.RAW_CONTENT

    built_in_css:
      type: toggle
      label: PLUGIN_SIMPLESEARCH.BUILTIN_CSS
      help: PLUGIN_SIMPLESEARCH.BUILTIN_CSS_HELP
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    built_in_js:
      type: toggle
      label: PLUGIN_SIMPLESEARCH.BUILTIN_JS
      help: PLUGIN_SIMPLESEARCH.BUILTIN_JS_HELP
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    use_modern_assets:
      type: toggle
      label: "Use Modern Assets"
      help: "Enable enhanced CSS and JavaScript with modern features (ES6+, dark mode, etc.)"
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    display_button:
      type: toggle
      label: PLUGIN_SIMPLESEARCH.DISPLAY_SEARCH_BUTTON
      help: PLUGIN_SIMPLESEARCH.DISPLAY_SEARCH_BUTTON_HELP
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    ignore_accented_characters:
      type: toggle
      label: PLUGIN_SIMPLESEARCH.IGNORE_ACCENDED_CHARACTERS
      help: PLUGIN_SIMPLESEARCH.IGNORE_ACCENDED_CHARACTERS_HELP
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    min_query_length:
      type: text
      size: x-small
      label: PLUGIN_SIMPLESEARCH.MIN_QUERY_LENGTH
      help: PLUGIN_SIMPLESEARCH.MIN_QUERY_LENGTH_HELP
      validate:
        type: number
        min: 0

    route:
      type: text
      size: medium
      label: PLUGIN_SIMPLESEARCH.SEARCH_PAGE_ROUTE
      help: PLUGIN_SIMPLESEARCH.SEARCH_PAGE_ROUTE_HELP
      default: /random

    searchable_types:
      type: checkboxes
      label: PLUGIN_SIMPLESEARCH.SEARCHABLE_TYPES
      description: PLUGIN_SIMPLESEARCH.SEARCHABLE_TYPES_DESCRIPTION
      options:
        title: Title
        content: Content
        header: Header
        taxonomy: Taxonomy
      use: keys

    header_keys_ignored:
      type: selectize
      size: large
      label: PLUGIN_SIMPLESEARCH.HEADER_KEYS_IGNORED
      help: PLUGIN_SIMPLESEARCH.HEADER_KEYS_IGNORED_HELP
      classes: fancy
      validate:
        type: commalist

    template:
      type: text
      size: medium
      label: PLUGIN_SIMPLESEARCH.SEARCH_PAGE_TEMPLATE
      help: PLUGIN_SIMPLESEARCH.SEARCH_PAGE_TEMPLATE_HELP
      default: simplesearch_results

    filters.category:
      type: selectize
      label: PLUGIN_SIMPLESEARCH.CATEGORY_FILTER
      help: PLUGIN_SIMPLESEARCH.CATEGORY_FILTER_HELP
      validate:
        type: commalist

    filter_combinator:
      type: select
      size: medium
      classes: fancy
      label: PLUGIN_SIMPLESEARCH.FILTER_COMBINATOR
      default: and
      options:
        and: PLUGIN_SIMPLESEARCH.AND_COMBINATOR
        or: PLUGIN_SIMPLESEARCH.OR_COMBINATOR

    order.by:
      type: select
      size: long
      classes: fancy
      label: PLUGIN_ADMIN.DEFAULT_ORDERING
      help: PLUGIN_ADMIN.DEFAULT_ORDERING_HELP
      options:
        default: PLUGIN_ADMIN.DEFAULT_ORDERING_DEFAULT
        folder: PLUGIN_ADMIN.DEFAULT_ORDERING_FOLDER
        title: PLUGIN_ADMIN.DEFAULT_ORDERING_TITLE
        date: PLUGIN_ADMIN.DEFAULT_ORDERING_DATE

    order.dir:
      type: toggle
      label: PLUGIN_ADMIN.DEFAULT_ORDER_DIRECTION
      highlight: asc
      default: desc
      help: PLUGIN_ADMIN.DEFAULT_ORDER_DIRECTION_HELP
      options:
        asc: PLUGIN_ADMIN.ASCENDING
        desc: PLUGIN_ADMIN.DESCENDING

    relevance_sort:
      type: toggle
      label: "Sort by Relevance"
      help: "Sort search results by relevance score instead of date/title (overrides order settings)"
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    results_per_page:
      type: number
      size: x-small
      label: "Results Per Page"
      help: "Number of search results to display per page (0 = no pagination)"
      default: 10
      validate:
        min: 0
        max: 100

    show_pagination_info:
      type: toggle
      label: "Show Pagination Info"
      help: "Display result count information (e.g., 'Showing 1-10 of 234')"
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    show_excerpts:
      type: toggle
      label: "Show Smart Excerpts"
      help: "Display context-aware excerpts centered around search terms"
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    excerpt_length:
      type: number
      size: small
      label: "Excerpt Length"
      help: "Length of smart excerpts in characters"
      default: 200
      validate:
        min: 50
        max: 500

    show_relevance_score:
      type: toggle
      label: "Show Relevance Score"
      help: "Display visual relevance indicators in search results"
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    instant_search:
      type: toggle
      label: "Enable Instant Search"
      help: "Show live search results as you type (requires JSON API)"
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    autocomplete:
      type: toggle
      label: "Enable Autocomplete"
      help: "Show search suggestions and recent searches"
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    keyboard_shortcuts:
      type: toggle
      label: "Enable Keyboard Shortcuts"
      help: "Enable Ctrl+K and / shortcuts to focus search"
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    cache_enabled:
      type: toggle
      label: "Enable Search Cache"
      help: "Cache search results for improved performance"
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    cache_lifetime:
      type: number
      size: small
      label: "Cache Lifetime"
      help: "Cache duration in seconds"
      default: 3600
      validate:
        min: 60
        max: 86400

    enable_json_api:
      type: toggle
      label: "Enable JSON API"
      help: "Enable JSON endpoint for AJAX requests"
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
